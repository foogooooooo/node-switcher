name: 问题反馈
description: 报告文档问题或未来预览版本的功能故障
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "当前仍处于立项阶段，尚无正式安装包。请使用脱敏信息描述问题。"
  - type: input
    id: version
    attributes:
      label: 版本或 commit
      description: 文档问题也可以填写页面地址。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 操作系统与代理客户端版本
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true
